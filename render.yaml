# Render Blueprint — one-click deploy of VA Lead Radar.
#
# Free Render accounts can run a WEB service but not a background worker, and the
# free filesystem is wiped on every deploy. So the bot runs in webhook mode
# (main.py) and keeps its data in an external Postgres (see DATABASE_URL below).
#
# WEBHOOK_BASE_URL is NOT set here on purpose: Render injects RENDER_EXTERNAL_URL
# with the public service URL, and config.py falls back to it automatically.
services:
  - type: web
    name: va-lead-radar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    # Rebuild automatically on every push to the linked branch.
    autoDeployTrigger: commit
    envVars:
      # Filled in the Render dashboard when prompted (sync: false = not stored here).
      - key: BOT_TOKEN
        sync: false
      # Telegram numeric user id of the admin who receives lead cards.
      - key: ADMIN_ID
        sync: false
      # Optional: more admins, comma-separated. Each one gets lead cards and can
      # use the commands, so a team can share one bot.
      # - key: ADMIN_IDS
      #   value: "123456789,987654321"
      # LLM key: Gemini (default) or OpenAI, depending on LLM_PROVIDER.
      - key: LLM_API_KEY
        sync: false
      # Paste the Neon (or Render Postgres) connection string, with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Shared secret so only Telegram can POST updates; Render generates it.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      # Adopt every chat the bot is added to, without /addchat. /pause excludes one.
      - key: MONITOR_ALL_CHATS
        value: "false"
      # Find orders on freelance boards and in public Telegram channels without
      # being added anywhere. Set POLL_SOURCES=false to disable polling.
      - key: POLL_SOURCES
        value: "true"
      - key: POLL_INTERVAL
        value: "900"
      # How many ~20-post preview pages of a public channel to read per cycle.
      # Covers the posts that appeared while the free instance was asleep.
      - key: TG_HISTORY_PAGES
        value: "5"
      # Ignore postings older than this. A dead feed keeps serving its last
      # post, which would otherwise arrive as a fresh lead.
      - key: MAX_ITEM_AGE_DAYS
        value: "30"
      # Seed starter sources and broad keywords on first run.
      - key: SEED_DEFAULT_SOURCES
        value: "true"
      # Uncomment to use an OpenAI-compatible gateway (e.g. OpenRouter) instead:
      # - key: OPENAI_BASE_URL
      #   value: https://openrouter.ai/api/v1
      # - key: LLM_MODEL
      #   value: nvidia/nemotron-3.5-lightning:free
      # - key: LLM_FALLBACK_MODELS
      #   value: inclusionai/ling-3.2-flash:free,baidu/ernie-5.5-flash-preview:free
      # Render's disk is ephemeral, so keep logs out of the project directory.
      - key: LOG_PATH
        value: /tmp/bot.log
